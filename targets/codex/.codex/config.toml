#:schema https://developers.openai.com/codex/config-schema.json

# 项目级 Codex 适配基线。
# 核心 prompt 资产仍位于 `src/`，这里仅注册 Codex 运行时需要的角色与配置。

approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "live"

[features]
multi_agent = true

[agents]
max_threads = 4
max_depth = 1

[agents.explorer]
description = "Read-only explorer for tracing how src assets and Codex adapters fit together."
config_file = "agents/explorer.toml"

[agents.reviewer]
description = "Repository-aware reviewer aligned with src/agents/quality-code-reviewer.md."
config_file = "agents/reviewer.toml"

[agents.quality_code_reviewer]
description = "Chinese code review specialist mapped from targets/codex/agents/quality-code-reviewer.md."
config_file = "agents/quality-code-reviewer.toml"

[agents.docs_researcher]
description = "Documentation specialist for Codex config, agent roles, and packaging assumptions."
config_file = "agents/docs-researcher.toml"
